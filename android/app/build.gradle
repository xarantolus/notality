plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'io.github.xarantolus.notality'
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    def releaseStorePath = keystoreProperties['storeFile'] ?: System.env.X_KEYSTORE_PATH

    signingConfigs {
        release {
            // Only configured when signing material is present, so debug builds
            // work without a keystore.
            if (releaseStorePath) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(releaseStorePath)
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "io.github.xarantolus.notality"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
            manifestPlaceholders = [ applicationLabel: "Notality (debug)" ]

            debuggable true
            signingConfig signingConfigs.debug
        }
        release {
            manifestPlaceholders = [ applicationLabel: "Notality" ]

            signingConfig releaseStorePath ? signingConfigs.release : signingConfigs.debug
            shrinkResources true
            minifyEnabled true
        }
        // The main manifest labels the app with ${applicationLabel}, so a build
        // type that does not define the placeholder fails the manifest merger.
        profile {
            applicationIdSuffix ".profile"
            versionNameSuffix "-profile"
            manifestPlaceholders = [ applicationLabel: "Notality (profile)" ]

            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
